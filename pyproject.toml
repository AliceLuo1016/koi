[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "koi"
version = "0.1.0"
description = "Terminal-based AI agent with memory, tool calling, skills, and system cron"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "httpx>=0.24.0",
    "rich>=13.0.0",
    "tiktoken>=0.5.0",
    "beautifulsoup4>=4.12.0",
    "pyyaml>=6.0",
    "prompt-toolkit>=3.0.0",
]

[project.scripts]
koi = "koi.__main__:main"

[project.optional-dependencies]
acp = [
    "agent-client-protocol>=0.8.0",
]
server = [
    "starlette>=0.30.0",
    "uvicorn>=0.23.0",
    "slack-sdk[socket-mode]>=3.21.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "black>=23.0.0",
    "ruff>=0.0.275",
]

[tool.hatch.build.targets.wheel]
packages = ["src/koi"]

[tool.hatch.build.targets.wheel.force-include]
"src/koi/bundled_skills" = "koi/bundled_skills"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.black]
line-length = 88
target-version = ['py39']

[tool.ruff]
line-length = 88
target-version = "py39"
select = ["E", "F", "W", "I", "N", "UP"]